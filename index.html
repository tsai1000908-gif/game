<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剪刀石頭布 終極大對決</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent-color: #e94560;
            --text-color: #ffffff;
            --sub-text: #00fff5;
            --button-bg: #0f3460;
            --button-hover: #533483;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            border: 2px solid #00fff533;
        }

        h1, h2, h3 {
            text-align: center;
            color: var(--sub-text);
            margin-top: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #ddd;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--sub-text);
            background-color: #0f3460;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: var(--accent-color);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #ff6b81;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            transform: none;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btns button {
            flex: 1;
            background-color: var(--button-bg);
        }

        .action-btns button:hover {
            background-color: var(--button-hover);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #ffdd59;
            font-size: 18px;
        }

        .log-box {
            background-color: #00000044;
            border: 1px solid #ffffff22;
            border-radius: 8px;
            height: 180px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .log-entry {
            margin-bottom: 5px;
        }
        .highlight { color: #00fff5; }
        .win { color: #4cd137; }
        .lose { color: #e84118; }
        .draw { color: #fbc531; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- 登入畫面 -->
    <div id="login-screen">
        <h1>⚔️ 冒險者登入 ⚔️</h1>
        <div class="form-group">
            <label for="player-name">冒險者名字：</label>
            <input type="text" id="player-name" placeholder="請輸入名字..." value="勇者">
        </div>
        <div class="form-group">
            <label for="equipment-name">裝備名稱：</label>
            <input type="text" id="equipment-name" placeholder="例如：絞鯊狂鱗、魔導神杖..." value="魔導神杖">
        </div>
        <button onclick="startGame()">踏上冒險之旅</button>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen" class="hidden">
        <h2>✊✋✌ 猜拳終極大對決</h2>
        
        <div class="card">
            <div id="player-info"></div>
        </div>

        <div class="card">
            <div class="status-bar">
                <span>🏆 回合：<span id="round-num">1</span></span>
                <span>👤 你：<span id="player-wins">0</span> 勝</span>
                <span>🤖 電腦：<span id="computer-wins">0</span> 勝</span>
            </div>
        </div>

        <!-- 遊戲訊息日誌 -->
        <div class="log-box" id="game-log"></div>

        <!-- 道具區域 -->
        <div class="card">
            <button id="mirror-btn" onclick="useMirror()">🔮 使用「偷窺之鏡」（剩餘 <span id="mirror-count">2</span> 次）</button>
        </div>

        <!-- 出拳選擇區 -->
        <div class="action-btns" id="choice-btns">
            <button onclick="playRound('剪刀')">✌️ 剪刀</button>
            <button onclick="playRound('石頭')">✊ 石頭</button>
            <button onclick="playRound('布')">✋ 布</button>
        </div>

        <!-- 重新開始 / 離開區 -->
        <div id="restart-area" class="hidden" style="margin-top: 15px;">
            <button onclick="resetGame()">🔄 重新開始新挑戰</button>
            <button onclick="exitGame()" style="background-color: #444;">🚪 結束遊戲</button>
        </div>
    </div>
</div>

<script>
    let gameState = {
        name: '',
        equipment: '',
        playerWins: 0,
        computerWins: 0,
        roundNum: 1,
        mirrorCount: 2,
        currentComputerChoice: '',
        gameOver: false
    };

    const options = ["剪刀", "石頭", "布"];

    function startGame() {
        const nameInput = document.getElementById('player-name').value.trim();
        const equipInput = document.getElementById('equipment-name').value.trim();

        if (!nameInput || !equipInput) {
            alert("請輸入冒險者名字與裝備名稱！");
            return;
        }

        gameState.name = nameInput;
        gameState.equipment = equipInput;

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        document.getElementById('player-info').innerHTML = 
            `歡迎冒險者 <b>${gameState.name}</b>！裝備：<b>${gameState.equipment}</b><br>規則：先獲得 3 勝的一方獲勝！`;

        startNewMatch();
    }

    function startNewMatch() {
        gameState.playerWins = 0;
        gameState.computerWins = 0;
        gameState.roundNum = 1;
        gameState.mirrorCount = 2;
        gameState.gameOver = false;

        document.getElementById('game-log').innerHTML = '';
        document.getElementById('restart-area').classList.add('hidden');
        document.getElementById('choice-btns').style.display = 'flex';
        document.getElementById('mirror-btn').disabled = false;

        updateUI();
        logMessage(`=== 戰鬥開始！ ===`, 'highlight');
        prepareNextRound();
    }

    function prepareNextRound() {
        if (gameState.gameOver) return;
        // 電腦預先決定拳型
        gameState.currentComputerChoice = options[Math.floor(Math.random() * options.length)];
    }

    function useMirror() {
        if (gameState.mirrorCount <= 0 || gameState.gameOver) return;

        gameState.mirrorCount--;
        document.getElementById('mirror-count').innerText = gameState.mirrorCount;

        if (gameState.mirrorCount === 0) {
            document.getElementById('mirror-btn').disabled = true;
        }

        // 50% 成功機率
        if (Math.random() < 0.5) {
            logMessage(`✨【偷窺之鏡發動成功！】透過魔法鏡面，你看到電腦這回合準備出【${gameState.currentComputerChoice}】！`, 'highlight');
        } else {
            logMessage(`💨【偷窺之鏡被對方發現了...】發動失敗，什麼都沒看到！`, 'lose');
        }
    }

    function playRound(playerChoice) {
        if (gameState.gameOver) return;

        const computerChoice = gameState.currentComputerChoice;
        logMessage(`--- 第 ${gameState.roundNum} 回合 ---`);
        logMessage(`👉 你出了：${playerChoice}`);
        logMessage(`🤖 天力電腦出了：${computerChoice}`);

        if (playerChoice === computerChoice) {
            logMessage(`...居然都出一樣，沒有人得分。`, 'draw');
        } else if (
            (playerChoice === "剪刀" && computerChoice === "布") ||
            (playerChoice === "石頭" && computerChoice === "剪刀") ||
            (playerChoice === "布" && computerChoice === "石頭")
        ) {
            logMessage(`🎉 這回合你贏了！`, 'win');
            gameState.playerWins++;
        } else {
            logMessage(`💥 這回合電腦贏了！`, 'lose');
            gameState.computerWins++;
        }

        gameState.roundNum++;
        updateUI();

        // 檢查勝負條件
        if (gameState.playerWins === 3 || gameState.computerWins === 3) {
            endGame();
        } else {
            prepareNextRound();
        }
    }

    function endGame() {
        gameState.gameOver = true;
        logMessage(`\n=== 🌟 最終結果 🌟 ===`, 'highlight');
        
        if (gameState.playerWins === 3) {
            logMessage(`🏆 恭喜你以 ${gameState.playerWins} : ${gameState.computerWins} 擊敗了天才電腦，成為猜拳大師！`, 'win');
        } else {
            logMessage(`💻 很可惜，電腦以 ${gameState.computerWins} : ${gameState.playerWins} 獲得了最終勝利，下次再來挑戰吧！`, 'lose');
        }

        document.getElementById('choice-btns').style.display = 'none';
        document.getElementById('mirror-btn').disabled = true;
        document.getElementById('restart-area').classList.remove('hidden');
    }

    function updateUI() {
        document.getElementById('round-num').innerText = gameState.roundNum;
        document.getElementById('player-wins').innerText = gameState.playerWins;
        document.getElementById('computer-wins').innerText = gameState.computerWins;
        document.getElementById('mirror-count').innerText = gameState.mirrorCount;
    }

    function logMessage(msg, className = '') {
        const logBox = document.getElementById('game-log');
        const entry = document.createElement('div');
        entry.className = `log-entry ${className}`;
        entry.innerText = msg;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function resetGame() {
        startNewMatch();
    }

    function exitGame() {
        logMessage(`\n感謝遊玩，再見了【${gameState.name}】！ 👋`, 'highlight');
        document.getElementById('restart-area').innerHTML = `<p style="text-align:center;">遊戲已結束，請重新整理網頁再次開啟遊戲。</p>`;
    }
</script>

</body>
</html>
